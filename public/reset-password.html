<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — HGS AgentX Capacity Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Raleway:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; }
  body.reset-body {
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    background: linear-gradient(135deg, var(--navy-deep), var(--navy));
    margin: 0;
  }
  .reset-box { width: 380px; max-width: 92vw; }
  .reset-box h3 { text-align: left; }
  .reset-box p.muted { text-align: left; }
  .reset-box .modal-label { text-align: left; }
  .reset-error { color: var(--red); font-size: 12.5px; font-weight: 600; min-height: 0; text-align: left; }
  .reset-error:empty { display: none; }
  .reset-success { color: var(--accent-ink); background: var(--accent-bg); border-radius: 8px; padding: 10px 12px; font-size: 13px; text-align: left; }
  .reset-success:empty { display: none; }
  .reset-box .modal-actions button, .reset-box .modal-actions a.btn { width: 100%; }
  .reset-box a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
</style>
</head>
<body class="reset-body">
  <div class="modal-box login-box reset-box" role="dialog" aria-modal="true">
    <div class="login-brand"><span class="wordmark">HGS<span class="dot">●</span></span></div>
    <h3 id="resetTitle">Reset your password</h3>
    <p class="muted" id="resetIntro">Choose a new password for your HGS AgentX Capacity Planner account.</p>
    <div class="reset-error" id="resetError"></div>
    <div class="reset-success" id="resetSuccess"></div>
    <form id="resetForm">
      <label class="modal-label">New password
        <input type="password" id="resetPassword" class="cell-input" autocomplete="new-password" minlength="8" required>
      </label>
      <label class="modal-label">Confirm new password
        <input type="password" id="resetPasswordConfirm" class="cell-input" autocomplete="new-password" minlength="8" required>
      </label>
      <div class="btn-row modal-actions">
        <button type="submit" class="btn btn-primary" id="resetSubmit">Update password</button>
      </div>
    </form>
    <p class="login-switch" id="resetBackLink"><a href="/">← Back to login</a></p>
  </div>

<script>
(function () {
  "use strict";
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");
  const form = document.getElementById("resetForm");
  const errorEl = document.getElementById("resetError");
  const successEl = document.getElementById("resetSuccess");
  const introEl = document.getElementById("resetIntro");
  const titleEl = document.getElementById("resetTitle");

  if (!token) {
    form.style.display = "none";
    titleEl.textContent = "Reset link missing";
    introEl.textContent = "This page needs a reset token in the URL — use the link from your password-reset email.";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.textContent = "";
    successEl.textContent = "";
    const password = document.getElementById("resetPassword").value;
    const confirm = document.getElementById("resetPasswordConfirm").value;
    if (password.length < 8) { errorEl.textContent = "Password must be at least 8 characters."; return; }
    if (password !== confirm) { errorEl.textContent = "Passwords don't match."; return; }

    const submitBtn = document.getElementById("resetSubmit");
    submitBtn.disabled = true;
    submitBtn.textContent = "Updating…";
    try {
      const res = await fetch("/api/auth/reset-password", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error((data && data.error) || "Something went wrong.");
      form.style.display = "none";
      titleEl.textContent = "Password updated";
      introEl.textContent = "";
      successEl.textContent = "Your password has been updated — you can now log in with it.";
    } catch (err) {
      errorEl.textContent = err.message || "Something went wrong.";
      submitBtn.disabled = false;
      submitBtn.textContent = "Update password";
    }
  });
})();
</script>
</body>
</html>
